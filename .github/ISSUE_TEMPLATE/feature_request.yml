name: Feature request
description: Propose an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to contribute it?
      description: Contributions use the DCO (git commit -s); see CONTRIBUTING.md.
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
