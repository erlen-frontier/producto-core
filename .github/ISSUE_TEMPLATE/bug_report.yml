name: Bug report
description: Report a reproducible problem (not a security vulnerability).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately (see SECURITY.md), not here.
        Do not include credentials, customer data or personal data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA (shown by the "Source" link of the running instance).
      placeholder: v0.1.0 or 0123abc
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Self-hosted
        - Managed service
        - Local development
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove secrets and personal data from logs before pasting.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability, and I removed secrets and personal data from this report.
          required: true
